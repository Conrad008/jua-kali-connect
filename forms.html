<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
          <!-- 5. FORMS, VALIDATION, & INTERACTIVE INPUTS -->
        <section id="forms">
            <h2>4. Interactive Forms & Validation</h2>
            <p>This section uses <strong>inline elements</strong> like <code>&lt;code&gt;</code> and <em>&lt;em&gt;</em>.</p>

            <form action="/submit-enrollment" method="POST">
                <fieldset>
                    <legend>Student Registration</legend>

                    <div class="form-group">
                        <label for="fname">Full Name:</label>
                        <input type="text" id="fname" name="fname" required minlength="4" placeholder="e.g. Joseph Kwanusu">
                    </div>

                    <div class="form-group">
                        <label for="uemail">Email Address:</label>
                        <input type="email" id="uemail" name="uemail" required>
                    </div>

                    <p><strong>Preferred Track:</strong></p>
                    <input type="radio" id="front" name="track" value="frontend" checked>
                    <label for="front" style="display:inline;">Frontend</label>
                    <input type="radio" id="back" name="track" value="backend">
                    <label for="back" style="display:inline;">Backend</label>

                    <p><strong>Known Languages:</strong></p>
                    <input type="checkbox" id="html_s" name="skills" value="html">
                    <label for="html_s" style="display:inline;">HTML</label>
                    <input type="checkbox" id="css_s" name="skills" value="css">
                    <label for="css_s" style="display:inline;">CSS</label>

                    <!-- SPECIALIZED INPUTS[cite: 1] -->
                    <div id="specialized" style="background: #eef7fa; padding: 15px; border-radius: 5px; margin-top: 15px; margin-bottom: 15px;">
                        <h3>Specialized HTML5 Controls</h3>
                        
                        <div class="form-group">
                            <label for="color">Choose Profile Color:</label>
                            <input type="color" id="color" name="color" value="#3498db">
                        </div>

                        <div class="form-group">
                            <label for="start_date">Cohort Start Date:</label>
                            <input type="date" id="start_date" name="start_date" min="2026-01-01">
                        </div>

                        <div class="form-group">
                            <label for="progress">Prior Experience Level (0-100):</label>
                            <input type="range" id="progress" name="progress" min="0" max="100" step="5">
                        </div>
                    </div>
    </body>

</html>
